<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Quản Lý Tài Sản Enterprise - Full React & Gemini AI & RBAC</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8', 800: '#1e40af', 900: '#1e3a8a', 950: '#172554'
            }
          }
        }
      }
    }
  </script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, 0.4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.6); }

    /* Print styles for Asset Tags */
    @media print {
      body * { visibility: hidden !important; }
      #printableArea, #printableArea * { visibility: visible !important; }
      #printableArea {
        position: fixed !important;
        left: 50% !important;
        top: 40px !important;
        transform: translateX(-50%) !important;
        width: 450px !important;
        padding: 24px !important;
        background: #ffffff !important;
        color: #000000 !important;
        border: 3px solid #000000 !important;
        border-radius: 12px !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen antialiased selection:bg-brand-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    // --- MOCK DATABASE WITH LOCALSTORAGE PERSISTENCE ---
    const INITIAL_USERS = [
      { username: 'admin', pass: 'admin123', name: 'Nguyễn Quản Trị', role: 'ADMIN', empId: 'ADM-001', avatar: '🛡️', title: 'Giám Đốc CNTT' },
      { username: 'manager', pass: 'manager123', name: 'Trần Văn Quản Lý', role: 'MANAGER', empId: 'MGR-002', avatar: '💼', title: 'Trưởng Phòng Vận Hành' },
      { username: 'emp', pass: 'emp123', name: 'Lê Thị Nhân Viên', role: 'EMPLOYEE', empId: 'EMP-003', avatar: '👤', title: 'Chuyên Viên Văn Phòng' }
    ];

    const INITIAL_ASSETS = [
      { id: 1, code: 'TS001', name: 'Laptop MSI Cyborg 15 A12V', category: 'Thiết bị CNTT', status: 'IN_USE', condition: 'GOOD', value: 24500000, location: 'Tầng 3 - Phòng IT', assignedTo: 'Trần Quốc Bảo', notes: 'Core i7-13620H, RTX 3050, Ram 16GB' },
      { id: 2, code: 'TS002', name: 'Màn hình Dell UltraSharp U2723QE 27"', category: 'Thiết bị CNTT', status: 'AVAILABLE', condition: 'NEW', value: 13200000, location: 'Kho Tầng 1', assignedTo: '', notes: 'Màn hình 4K IPS Đồ họa chuyên nghiệp' },
      { id: 3, code: 'TS003', name: 'Bàn phím cơ Akko 3098B Plus', category: 'Phụ kiện', status: 'MAINTENANCE', condition: 'FAIR', value: 2100000, location: 'Phòng Kỹ thuật', assignedTo: 'Kỹ thuật viên', notes: 'Đang gửi bảo hành chập chập switch' },
      { id: 4, code: 'TS004', name: 'Máy in Laser Canon LBP 2900', category: 'Thiết bị Văn phòng', status: 'IN_USE', condition: 'GOOD', value: 4600000, location: 'Phòng Kế Toán', assignedTo: 'Nguyễn Thị Hoa', notes: 'Máy in khổ A4 chính chủ' },
      { id: 5, code: 'TS005', name: 'Ghế Ergonomic Herman Miller Aeron', category: 'Nội thất', status: 'IN_USE', condition: 'GOOD', value: 35000000, location: 'Phòng Giám Đốc', assignedTo: 'Nguyễn Quản Trị', notes: 'Ghế công thái học cao cấp' },
      { id: 6, code: 'TS006', name: 'Máy chiếu Epson EB-FH52 4k', category: 'Thiết bị Văn phòng', status: 'DAMAGED', condition: 'DAMAGED', value: 18900000, location: 'Kho Tầng 1', assignedTo: '', notes: 'Hỏng bóng đèn chiếu, cần thay bóng' }
    ];

    const INITIAL_LOGS = [
      { id: 'LOG-1001', timestamp: '2026-11-17 08:30:15', action: 'LOGIN', assetCode: 'SYSTEM', performedBy: 'Nguyễn Quản Trị (ADMIN)', details: 'Đăng nhập hệ thống thành công' },
      { id: 'LOG-1002', timestamp: '2026-11-17 09:15:00', action: 'CREATE', assetCode: 'TS005', performedBy: 'Nguyễn Quản Trị (ADMIN)', details: 'Thêm mới tài sản Ghế Ergonomic Herman Miller Aeron' }
    ];

    const PERMISSIONS = {
      ADMIN: ['VIEW_ASSETS', 'ADD_ASSET', 'EDIT_ASSET', 'DELETE_ASSET', 'EXPORT_DATA', 'VIEW_LOGS', 'PRINT_QR', 'MANAGE_USERS', 'AI_ANALYTICS'],
      MANAGER: ['VIEW_ASSETS', 'ADD_ASSET', 'EDIT_ASSET', 'EXPORT_DATA', 'VIEW_LOGS', 'PRINT_QR', 'AI_ANALYTICS'],
      EMPLOYEE: ['VIEW_ASSETS', 'PRINT_QR']
    };

    function MainApp() {
      // Persistence State
      const [users] = useState(INITIAL_USERS);
      const [assets, setAssets] = useState(() => JSON.parse(localStorage.getItem('app_assets')) || INITIAL_ASSETS);
      const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('app_logs')) || INITIAL_LOGS);
      const [currentUser, setCurrentUser] = useState(() => JSON.parse(localStorage.getItem('app_session')) || null);

      // UI State
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterCategory, setFilterCategory] = useState('ALL');
      const [filterStatus, setFilterStatus] = useState('ALL');

      // Modals & Alerts
      const [showAssetModal, setShowAssetModal] = useState(false);
      const [editingAsset, setEditingAsset] = useState(null);
      const [selectedQrAsset, setSelectedQrAsset] = useState(null);
      const [toast, setToast] = useState(null);
      const [showForbiddenModal, setShowForbiddenModal] = useState(false);
      const [forbiddenMsg, setForbiddenMsg] = useState('');
      const [deleteConfirmAsset, setDeleteConfirmAsset] = useState(null);

      // Gemini AI Analytics State
      const [aiLoading, setAiLoading] = useState(false);
      const [aiReport, setAiReport] = useState(null);

      // Sync LocalStorage
      useEffect(() => { localStorage.setItem('app_assets', JSON.stringify(assets)); }, [assets]);
      useEffect(() => { localStorage.setItem('app_logs', JSON.stringify(logs)); }, [logs]);
      useEffect(() => {
        if (currentUser) {
          localStorage.setItem('app_session', JSON.stringify(currentUser));
        } else {
          localStorage.removeItem('app_session');
        }
      }, [currentUser]);

      const showToast = (msg, type = 'info') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      const addLog = useCallback((action, assetCode, details) => {
        if (!currentUser) return;
        const newLog = {
          id: 'LOG-' + Date.now(),
          timestamp: new Date().toLocaleString('sv-SE'),
          action,
          assetCode,
          performedBy: `${currentUser.name} (${currentUser.role})`,
          details
        };
        setLogs(prev => [newLog, ...prev]);
      }, [currentUser]);

      const hasPermission = (perm) => {
        if (!currentUser) return false;
        return (PERMISSIONS[currentUser.role] || []).includes(perm);
      };

      const checkPermission = (perm, callback) => {
        if (!hasPermission(perm)) {
          setForbiddenMsg(`Tài khoản vai trò [${currentUser.role}] không đủ thẩm quyền thực hiện hành động: ${perm}`);
          setShowForbiddenModal(true);
          return false;
        }
        if (callback) callback();
        return true;
      };

      // Authentication
      const handleLogin = (e) => {
        e.preventDefault();
        const usernameInput = e.target.username.value.trim();
        const passwordInput = e.target.password.value;

        const foundUser = users.find(u => u.username === usernameInput && u.pass === passwordInput);

        if (foundUser) {
          const userSession = {
            ...foundUser,
            token: `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.token_${Date.now()}`
          };
          setCurrentUser(userSession);
          showToast(`Chào mừng ${foundUser.name} (${foundUser.role}) quay trở lại!`, 'success');
          
          // Log Activity
          const newLog = {
            id: 'LOG-' + Date.now(),
            timestamp: new Date().toLocaleString('sv-SE'),
            action: 'LOGIN',
            assetCode: 'SYSTEM',
            performedBy: `${foundUser.name} (${foundUser.role})`,
            details: `Đăng nhập hệ thống với JWT Token thành công`
          };
          setLogs(prev => [newLog, ...prev]);
        } else {
          showToast('Tên đăng nhập hoặc mật khẩu không chính xác!', 'warning');
        }
      };

      const handleLogout = () => {
        if (currentUser) {
          addLog('LOGOUT', 'SYSTEM', 'Đăng xuất khỏi hệ thống');
        }
        setCurrentUser(null);
        showToast('Đã đăng xuất an toàn khỏi ứng dụng.', 'info');
      };

      // Filtered Assets Computation
      const filteredAssets = useMemo(() => {
        return assets.filter(a => {
          const matchSearch = (a.name + a.code + a.assignedTo + a.location + a.category).toLowerCase().includes(searchQuery.toLowerCase());
          const matchCat = filterCategory === 'ALL' || a.category === filterCategory;
          const matchStat = filterStatus === 'ALL' || a.status === filterStatus;
          return matchSearch && matchCat && matchStat;
        });
      }, [assets, searchQuery, filterCategory, filterStatus]);

      // Asset Form Handler
      const handleSaveAsset = (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const assetObj = {
          code: formData.get('code').trim(),
          name: formData.get('name').trim(),
          category: formData.get('category'),
          value: Number(formData.get('value')) || 0,
          status: formData.get('status'),
          condition: formData.get('condition'),
          assignedTo: formData.get('assignedTo').trim(),
          location: formData.get('location').trim(),
          notes: formData.get('notes').trim()
        };

        if (editingAsset) {
          checkPermission('EDIT_ASSET', () => {
            setAssets(prev => prev.map(a => a.id === editingAsset.id ? { ...a, ...assetObj } : a));
            addLog('UPDATE', assetObj.code, `Cập nhật thông tin tài sản: ${assetObj.name}`);
            showToast(`Cập nhật thành công tài sản ${assetObj.code}`, 'success');
            setShowAssetModal(false);
            setEditingAsset(null);
          });
        } else {
          checkPermission('ADD_ASSET', () => {
            if (assets.some(a => a.code === assetObj.code)) {
              showToast(`Mã tài sản [${assetObj.code}] đã tồn tại trong hệ thống!`, 'warning');
              return;
            }
            const newObj = { id: Date.now(), ...assetObj };
            setAssets(prev => [newObj, ...prev]);
            addLog('CREATE', assetObj.code, `Khởi tạo tài sản mới: ${assetObj.name}`);
            showToast(`Tạo mới tài sản ${assetObj.code} thành công`, 'success');
            setShowAssetModal(false);
          });
        }
      };

      const confirmDeleteAsset = () => {
        if (!deleteConfirmAsset) return;
        checkPermission('DELETE_ASSET', () => {
          const target = deleteConfirmAsset;
          setAssets(prev => prev.filter(a => a.id !== target.id));
          addLog('DELETE', target.code, `Xóa tài sản khỏi cơ sở dữ liệu: ${target.name}`);
          showToast(`Đã xóa tài sản [${target.code}] thành công`, 'warning');
          setDeleteConfirmAsset(null);
        });
      };

      // Export CSV UTF-8 with BOM
      const handleExportCSV = () => {
        checkPermission('EXPORT_DATA', () => {
          const headers = ['Mã TS', 'Tên Tài Sản', 'Danh Mục', 'Giá Trị (VNĐ)', 'Trạng Thái', 'Tình Trạng', 'Người Giữ', 'Vị Trí', 'Ghi Chú'];
          const rows = assets.map(a => [
            `"${a.code}"`,
            `"${a.name.replace(/"/g, '""')}"`,
            `"${a.category}"`,
            a.value,
            `"${a.status}"`,
            `"${a.condition}"`,
            `"${a.assignedTo}"`,
            `"${a.location}"`,
            `"${a.notes.replace(/"/g, '""')}"`
          ]);

          const csvContent = "\uFEFF" + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
          const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.setAttribute('download', `Enterprise_Assets_Report_${new Date().toISOString().split('T')[0]}.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          addLog('EXPORT', 'DATABASE', 'Xuất toàn bộ báo cáo danh mục tài sản ra file Excel CSV');
          showToast('Đã xuất thành công báo cáo Excel CSV (UTF-8)!', 'success');
        });
      };

      // --- REAL GEMINI AI ANALYTICS ENGINE INTEGRATION ---
      const runGeminiAiAnalytics = async () => {
        checkPermission('AI_ANALYTICS', async () => {
          setAiLoading(true);
          setAiReport(null);

          const summaryText = assets.map(a => `- Mã ${a.code}: ${a.name} (Loại: ${a.category}, Giá trị: ${a.value.toLocaleString()} VND, Trạng thái: ${a.status}, Tình trạng: ${a.condition}, Vị trí: ${a.location})`).join('\n');

          const userPrompt = `Dưới đây là danh sách hiện trạng ${assets.length} tài sản của doanh nghiệp:\n${summaryText}\n\nHãy phân tích và lập báo cáo chuyên sâu bằng tiếng Việt bao gồm:\n1. TỔNG QUAN VẬN HÀNH & CHỈ SỐ RỦI RO (%):\n2. DANH SÁCH THIẾT BỊ CẦN BẢO TRÌ/THAY THẾ GẤP:\n3. DỰ BÁO NGÂN SÁCH BẢO TRÌ & THAY THẾ (VNĐ):\n4. ĐỀ XUẤT CHIẾN LƯỢC TỐI ƯU HÓA VẬN HÀNH:`;

          const systemPrompt = "Bạn là Chuyên gia Quản lý Tài sản Enterprise và Phân tích Rủi ro Thiết bị. Hãy đưa ra nhận định thực tế, súc tích, chuyên nghiệp và có tính ứng dụng cao cho phòng CNTT & Quản trị cơ sở vật chất.";

          const apiKey = ""; // Canvas runtime auto-injects Gemini API key when empty string
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

          try {
            const response = await fetch(apiUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
              })
            });

            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (aiText) {
              setAiReport(aiText);
              addLog('AI_ANALYTICS', 'GEMINI_AI', 'Thực hiện phân tích AI rủi ro tài sản với Gemini-3-Flash');
              showToast('Đã cập nhật báo cáo phân tích AI Gemini thành công!', 'success');
            } else {
              throw new Error('Không nhận được nội dung từ Gemini API');
            }
          } catch (err) {
            console.warn('Gemini API fetch error fallback:', err);
            // Fallback Heuristic Generator if API call fails
            const totalVal = assets.reduce((s, a) => s + a.value, 0);
            const maintenanceCount = assets.filter(a => a.status === 'MAINTENANCE' || a.condition === 'DAMAGED').length;
            const riskRatio = Math.round((maintenanceCount / Math.max(assets.length, 1)) * 100);

            const fallbackReport = `### 🤖 BÁO CÁO PHÂN TÍCH QUẢN LÝ TÀI SẢN (DỰ PHÒNG THÔNG MINH)

1. TỔNG QUAN VẬN HÀNH & CHỈ SỐ RỦI RO:
- Chỉ số rủi ro hỏng hóc hiện tại: **${riskRatio}%** (${maintenanceCount}/${assets.length} thiết bị có vấn đề).
- Tổng định giá tài sản doanh nghiệp: **${totalVal.toLocaleString('vi-VN')} ₫**.
- Trạng thái tổng thể: ${riskRatio > 30 ? '🔴 Cảnh báo mức độ rủi ro cao!' : '🟢 Hệ thống hoạt động tương đối ổn định.'}

2. THIẾT BỊ CẦN CHÚ Ý NGHÊM NGẶT:
${assets.filter(a => a.status === 'MAINTENANCE' || a.condition === 'DAMAGED').map(a => `- **${a.code} - ${a.name}**: Tình trạng [${a.condition}], tại vị trí [${a.location}].`).join('\n') || '- Tất cả thiết bị hiện đều ở trạng thái hoạt động tốt.'}

3. DỰ BÁO NGÂN SÁCH BẢO TRÌ KỲ TỚI:
- Dự trù kinh phí sửa chữa & bảo dưỡng: **${(totalVal * 0.05).toLocaleString('vi-VN')} ₫** (khoảng 5% giá trị tài sản).
- Dự phòng thay mới tài sản hỏng: **${(totalVal * 0.08).toLocaleString('vi-VN')} ₫**.

4. ĐỀ XUẤT TỐI ƯU HÓA:
- Tiến hành nghiệm thu và lập biên bản thay thế cho thiết bị hư hỏng nặng.
- Thực hiện dán mã tem QR Tag cho 100% tài sản trong kho để kiểm kê chính xác.`;
            setAiReport(fallbackReport);
            showToast('Hiển thị báo cáo phân tích heuristic dự phòng!', 'info');
          } finally {
            setAiLoading(false);
          }
        });
      };

      // ----------------------------------------------------
      // RENDER 1: LOGIN VIEW IF NOT AUTHENTICATED
      // ----------------------------------------------------
      if (!currentUser) {
        return (
          <div class="min-h-screen bg-slate-950 flex flex-col justify-center items-center p-4 relative overflow-hidden">
            {/* Background glowing gradients */}
            <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-brand-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-purple-600/15 rounded-full blur-3xl pointer-events-none"></div>

            <div class="w-full max-w-md bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl z-10 space-y-6">
              <div class="text-center space-y-2">
                <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-500 text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-brand-500/30">
                  <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <h2 class="text-2xl font-black text-white tracking-tight">AssetPro Enterprise</h2>
                <p class="text-xs text-slate-400 font-medium">Hệ Thống Quản Lý Tài Sản & Phân Tích Gemini AI</p>
              </div>

              {/* Toast Alert in Login */}
              {toast && (
                <div class={`p-3.5 rounded-xl text-xs font-bold flex items-center gap-2 ${toast.type === 'warning' ? 'bg-amber-950/80 border border-amber-800 text-amber-300' : 'bg-brand-950/80 border border-brand-800 text-brand-300'}`}>
                  <i class="fa-solid fa-triangle-exclamation text-base"></i> {toast.msg}
                </div>
              )}

              <form onSubmit={handleLogin} class="space-y-4">
                <div>
                  <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Tên Đăng Nhập</label>
                  <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input name="username" defaultValue="admin" required placeholder="admin / manager / emp" class="w-full pl-9 pr-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm font-medium focus:outline-none focus:border-brand-500 text-white transition-all" />
                  </div>
                </div>

                <div>
                  <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Mật Khẩu</label>
                  <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs"></i>
                    <input name="password" type="password" defaultValue="admin123" required placeholder="••••••••" class="w-full pl-9 pr-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-sm font-medium focus:outline-none focus:border-brand-500 text-white transition-all" />
                  </div>
                </div>

                <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-extrabold text-sm rounded-xl shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                  <i class="fa-solid fa-right-to-bracket"></i> Đăng Nhập Hệ Thống
                </button>
              </form>

              {/* Quick Login Helper */}
              <div class="pt-4 border-t border-slate-800 space-y-2">
                <span class="text-[11px] font-bold text-slate-400 block text-center uppercase tracking-wider">Chọn Nhanh Tài Khoản Demo (RBAC)</span>
                <div class="grid grid-cols-3 gap-2 text-xs">
                  {users.map(u => (
                    <button key={u.username} onClick={() => {
                      setCurrentUser({ ...u, token: `eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.token_${Date.now()}` });
                      showToast(`Đăng nhập thành công vai trò ${u.role}`, 'success');
                    }} class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-xl border border-slate-700 text-center flex flex-col items-center gap-1 transition-all">

from rest_framework.response import Response
from .models import Asset, AuditLog
from .serializers import AssetSerializer

class IsAdminOrManagerUser(permissions.BasePermission):
    """Custom RBAC Permission Class"""
    def has_permission(self, request, view):
        if request.method in permissions.SAFE_METHODS:
            return True # ALL authenticated users can view
        
        # ADD/EDIT requires MANAGER or ADMIN
        user_role = request.user.profile.role
        if request.method in ['POST', 'PUT', 'PATCH']:
            return user_role in ['ADMIN', 'MANAGER']
            
        # DELETE requires ADMIN only
        if request.method == 'DELETE':
            return user_role == 'ADMIN'
            
        return False

class AssetViewSet(viewsets.ModelViewSet):
    queryset = Asset.objects.all()
    serializer_class = AssetSerializer
    permission_classes = [permissions.IsAuthenticated, IsAdminOrManagerUser]

    def perform_destroy(self, instance):
        AuditLog.objects.create(
            action="DELETE",
            asset_code=instance.code,
            performed_by=f"{self.request.user.username} ({self.request.user.profile.role})"
        )
        instance.delete()`}
